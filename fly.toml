# fly.toml app configuration file generated for anniexboda-cpp on 2026-10-16T10:49:57Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'anniexboda-cpp'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  IP_VERSION = '4'
  TMPDIR = '/dev/shm'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = 'performance'
  cpus = 4
  memory_mb = 8192
